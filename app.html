<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Now Playing Overlay</title>
<style>
  :root{ --bg:#080B14; --panel:#10141F; --line:#1E2740; --fg:#EAF2FF; --dim:#8A9BC0;
         --accent:#9BD4F5; --trim:#C9A961; --on-accent:#04121F;
         --input:#0A0F1A; --ghost:#1B2438; --ghost-h:#24304A;
         --track:#2A3550; --hair:#171F31; --code:#BFE6FA; }
  /* Other palettes come from /themes as data - shared.js applies them. */
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);display:flex;flex-direction:column;
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
  header{padding:18px 32px;border-bottom:1px solid var(--line);display:flex;
    align-items:center;gap:18px;flex-wrap:wrap;flex:0 0 auto}
  h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
  nav{display:flex;gap:6px;flex-wrap:wrap}
  nav button{background:var(--panel);border:1px solid var(--line);color:var(--dim);
    border-radius:9px;padding:8px 15px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
  nav button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  nav button:not([aria-pressed=true]):hover{color:var(--fg)}
  .spacer{flex:1 1 auto}
  .obslink{color:var(--dim);font-size:12.5px;text-decoration:none}
  .obslink:hover{color:var(--fg)}
  /* The update corner. At rest it is a quiet "Check for updates" in link
     clothing - always there, because pushes land faster than the half-hour
     cache and waiting it out is not a workflow. When something IS found the
     control turns gold, this app's colour for "look here". */
  .upd{display:flex;align-items:center;font-size:12.5px;color:var(--dim);white-space:nowrap}
  .upd .updgo{background:var(--trim);border:1px solid var(--trim);color:var(--on-accent);
    border-radius:9px;padding:8px 15px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
  .upd .updgo:disabled{opacity:.6;cursor:default}
  .upd .updcheck{background:none;border:0;padding:0;font:inherit;font-size:12.5px;
    color:var(--dim);cursor:pointer;text-decoration:none}
  .upd .updcheck:hover:not(:disabled){color:var(--fg)}
  .upd .updcheck:disabled{cursor:default}
  /* The off switch for automatic updates. Small and to the side: it is not a
     decision anyone should have to make, only one they must be able to. */
  .upd .updauto{display:inline-flex;align-items:center;gap:4px;margin-left:10px;
    color:var(--dim);cursor:pointer;user-select:none}
  .upd .updauto input{margin:0;cursor:pointer}
  .themes{display:flex;gap:5px;align-items:center}
  .themes button{width:22px;height:22px;padding:0;border-radius:50%;cursor:pointer;
    border:2px solid transparent}
  .themes button[aria-pressed=true]{border-color:var(--fg)}
  /* Swatch colours are set inline per button, straight from each theme's data. */

  .content{flex:1 1 auto;position:relative;min-height:0}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);
    display:none}
  iframe.on{display:block}
</style>
<script src="/shared.js"></script>
<script>if(window.NPO) NPO.themeBoot('dashboard');</script>
</head>
<body>
<header>
  <h1>Now Playing Overlay</h1>
  <nav id="nav"></nav>
  <span class="spacer"></span>
  <div class="themes" id="themes" title="Colour theme"></div>
  <span class="upd" id="upd"></span>
  <a class="obslink" href="#help">OBS source URLs &amp; setup &rarr;</a>
</header>
<div class="content" id="content"></div>

<script>
(function(){
  // Three separate pages, one shell. Each already exists as a full standalone
  // document - OBS never sees this page, so an iframe per tab is the cheapest
  // way to give them one shared header and nav without merging three unrelated
  // stylesheets and scripts into one file and risking id/class collisions.
  var TABS = [
    ['control',   'Choose source', '/control'],
    ['layouts',   'Layouts',       '/layouts'],
    ['customize', 'Customize',     '/customize'],
    ['looks',     'Saved looks',   '/looks'],
    ['themes',    'Themes',        '/themes-page'],
    ['bot',       'Chat bot',      '/bot-page'],
    ['features',  'Features',      '/features'],
    ['help',      'How to use',    '/help']
  ];

  var navEl = document.getElementById('nav'), contentEl = document.getElementById('content');
  var frames = {};

  TABS.forEach(function(t){
    var id = t[0];
    var f = document.createElement('iframe');
    f.title = t[1];
    f._url = t[2] + '?embed=1';   // assigned on first show - see ensureLoaded
    // A frame that finishes loading after a switch would otherwise come up on
    // the old palette. Each page also reads the same key from its own head, so
    // this is a belt-and-braces for the frame that was mid-load at the time.
    f.addEventListener('load', function(){ paintFrame(f, currentTheme()); });
    contentEl.appendChild(f);
    frames[id] = f;

    var b = document.createElement('button');
    b.type = 'button'; b.textContent = t[1];
    b.addEventListener('click', function(){ select(id, true); });
    navEl.appendChild(b);
    frames[id]._btn = b;
  });

  // The bot's OAuth flow bounces the whole tab out to Twitch and back to
  // /app?botoauth=...#bot. The outcome belongs to the bot page, which lives in
  // an iframe and cannot see this page's query string - so hand it down, then
  // scrub the address bar so a later reload doesn't replay a stale banner.
  var boot = new URLSearchParams(location.search);
  if(boot.get('botoauth') || boot.get('botoautherr')){
    if(boot.get('botoauth'))
      frames.bot._url += '&botoauth=' + encodeURIComponent(boot.get('botoauth'));
    if(boot.get('botoautherr'))
      frames.bot._url += '&botoautherr=' + encodeURIComponent(boot.get('botoautherr'));
    history.replaceState(null, '', location.pathname + location.hash);
  }

  // A hidden iframe is not a free iframe. display:none stops it painting, but it
  // still loads, still runs its scripts, and still holds its network connections
  // - and a browser allows only six per origin over HTTP/1.1. The layouts tab
  // alone holds six long-lived event streams, so building every tab up front
  // meant the tab you actually asked for could never get a connection: its
  // preview frames, its /np polls and its album art all queued behind streams
  // feeding panels nobody was looking at. That is what "the preview shows
  // nothing" and "layouts is always loading" were - not a rendering fault.
  //
  // Loading on first show keeps an unvisited tab's cost at zero. Once loaded a
  // tab stays loaded, so switching away and back does not throw away a half
  // finished edit in the customizer.
  function ensureLoaded(f){
    if(f._loaded) return;
    f._loaded = true;
    f.src = f._url;
  }

  function select(id, pushHash){
    if(!frames[id]) id = TABS[0][0];
    TABS.forEach(function(t){
      var on = t[0] === id;
      frames[t[0]].classList.toggle('on', on);
      frames[t[0]]._btn.setAttribute('aria-pressed', String(on));
      if(on) ensureLoaded(frames[t[0]]);
    });
    if(pushHash) location.hash = id;
  }

  window.addEventListener('hashchange', function(){
    select(location.hash.slice(1), false);
  });

  // ---- theme ----------------------------------------------------------------
  // Themes are data served by /themes (see shared.js). The buttons are built
  // from that list, so a theme dropped into the themes folder shows up in this
  // header without anyone editing this page.
  //
  // Reloading the frames was the wrong tool twice over. Assigning src to its own
  // current value is a no-op, and location.reload() on a same-origin frame turns
  // out not to fire a load at all in some embedders - in both cases the shell
  // recoloured while every panel inside it stayed on the old palette, which is
  // what "the theme changes nothing" looks like from the outside. The frames are
  // same-origin, so shared.js can just write the palette into each of them
  // directly. No reload, no flash, and edits in progress in the customizer are
  // not thrown away to change a colour.
  //
  // localStorage is kept only as the instant answer that avoids a flash of the
  // wrong palette before the fetch lands (shared.js reads it in themeBoot). The
  // app is the real store: it is the only one an OBS browser source can read,
  // and the only one that does not disagree between localhost and 127.0.0.1,
  // which are separate origins with separate storage.
  var themesEl = document.getElementById('themes');
  var themeList = null;              // the /themes answer, kept for painting frames

  function defFor(name){
    return (window.NPO && NPO.findTheme(themeList, name)) || { name: name };
  }

  function paintFrame(f, name){
    // Until /themes has answered there is nothing real to paint, and painting
    // the name alone would blank a palette the frame already gave itself -
    // every embedded page runs its own themeBoot, so silence here is safe.
    if(!themeList) return;
    try { if(f && f.contentDocument && window.NPO) NPO.applyThemeDef(defFor(name), 'dashboard', f.contentDocument); }
    catch(e){}
  }

  function applyTheme(name, propagate, save){
    if(window.NPO) NPO.applyThemeDef(defFor(name), 'dashboard', document);
    try {
      localStorage.setItem('nowplaying.theme', name);
      // Keep the flash-guard cache in step, or the next load would briefly
      // paint the palette this click just left behind.
      if(window.NPO) localStorage.setItem('nowplaying.themeCss', NPO.cssFor(defFor(name), 'dashboard'));
    } catch(e){}
    if(save !== false){
      try {
        fetch('/prefs/set?key=theme&value=' + encodeURIComponent(name), {cache:'no-store'})
          .catch(function(){});     // a theme that did not persist is not worth a dialog
      } catch(e){}
    }
    [].forEach.call(themesEl.children, function(b){
      b.setAttribute('aria-pressed', String(b.getAttribute('data-t') === name)); });
    if(propagate) TABS.forEach(function(t){ paintFrame(frames[t[0]], name); });
  }

  function currentTheme(){
    try { return localStorage.getItem('nowplaying.theme') || 'shockblade'; }
    catch(e){ return 'shockblade'; }
  }

  // Swatches come from theme data, so only plain colour values get through -
  // anything fancier is somebody's hand-edited file trying to be clever.
  function swatchColor(c){
    return (typeof c === 'string' && /^#(?:[0-9a-fA-F]{3,4}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/.test(c)) ? c : null;
  }

  function buildButtons(){
    themesEl.innerHTML = '';
    ((themeList && themeList.themes) || []).forEach(function(def){
      if(!def || !def.name) return;
      var b = document.createElement('button');
      b.type = 'button';
      b.title = def.label || def.name;
      b.setAttribute('data-t', def.name);
      var sw = def.swatch || [];
      var c1 = swatchColor(sw[0]), c2 = swatchColor(sw[1]);
      b.style.background = (c1 && c2) ? 'linear-gradient(135deg,' + c1 + ',' + c2 + ')'
                         : (c1 || 'var(--panel)');
      b.addEventListener('click', function(){ applyTheme(def.name, true); });
      themesEl.appendChild(b);
    });
    [].forEach.call(themesEl.children, function(b){
      b.setAttribute('aria-pressed', String(b.getAttribute('data-t') === currentTheme())); });
  }

  // The Themes tab lives in one of these frames and applies themes itself;
  // this hook lets it hand the change up so the shell's swatch highlight and
  // every other frame move at the same moment, not on the next reload.
  window.__npoThemeChanged = function(name){
    if(window.NPO) NPO.themes(function(j){
      if(j) themeList = j;
      buildButtons();
      applyTheme(name, true, false);   // the tab already saved it server-side
    });
  };

  if(window.NPO) NPO.themes(function(j){
    if(!j) return;                   // no answer, no buttons; themeBoot already painted the cache
    themeList = j;
    buildButtons();
    // Take the app's answer, which is the one every other page and every OBS
    // source is also reading. save:false so simply opening the dashboard on a
    // second machine cannot overwrite the shared choice with this browser's
    // stale local copy.
    applyTheme(j.active || currentTheme(), true, false);
  });

  select(location.hash.slice(1) || TABS[0][0], false);

  // ---- updates --------------------------------------------------------------
  // One quiet check when the dashboard opens; the app caches the answer for
  // half an hour, so this is not a GitHub call per page load. When the build
  // is current, nothing is drawn at all. When it isn't, one gold button:
  // pressing it makes the app download the latest source, rebuild itself on
  // this PC (the same thing Build.bat does, nothing downloaded but source)
  // and restart. The page follows /update/status the whole way through.
  //
  // "It restarted" is detected by OUTCOME, not by catching the server down:
  // the whole swap takes under two seconds, which can fall entirely between
  // two once-a-second polls - a page that only reloaded on a failed fetch sat
  // saying "Updating..." forever at a server that had already finished (that
  // was a real evening). Every build carries a unique stamp, so the moment
  // /update/status answers with a different build than the one this page
  // started from, the update demonstrably happened and the page reloads.
  // The failed-fetch path stays as the fallback for slower machines, where
  // the gap IS observable.
  var updEl = document.getElementById('upd');
  var updBuild = null;   // the build this page was talking to first

  function updSay(text){ updEl.textContent = text; }

  function updWaitBack(){
    fetch('/update/status', {cache:'no-store'})
      .then(function(){ location.reload(); })
      .catch(function(){ setTimeout(updWaitBack, 1000); });
  }

  function updPoll(){
    fetch('/update/status', {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(updBuild && j.build && j.build !== updBuild){ location.reload(); return; }
        if(j.state === 'error'){ updSay(j.detail || 'The update failed - see the log.'); return; }
        // idle from the same build would mean the run never started, but
        // updPoll only begins after /update/run said ok - so idle here is the
        // new process answering before the stamp comparison had a build to
        // compare (belt for the buckle above).
        if(j.state === 'idle'){ location.reload(); return; }
        updSay(j.detail || 'Updating...');
        setTimeout(updPoll, 1000);
      })
      .catch(function(){
        updSay('Restarting on the new build...');
        updWaitBack();
      });
  }

  function updRun(){
    updSay('Starting the update...');
    fetch('/update/run', {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(j && j.ok) updPoll();
        else updSay((j && j.error) || 'Could not start the update.');
      })
      .catch(function(){ updSay('Could not start the update.'); });
  }

  // Automatic updates are the normal state, so the switch is small and off to
  // the side - not a decision anyone should have to make, only one they have
  // to be able to make. The wording carries the rule, because "Auto" on its
  // own does not tell you it installs the moment it finds one, stream or no
  // stream - and whoever that blink is not worth it to needs to know this
  // tickbox is where that choice lives.
  var updAuto = true;

  function updAutoToggle(){
    var w = document.createElement('label');
    w.className = 'updauto';
    w.title = 'Installs new versions on its own the moment one is found, checking '
            + 'every four minutes. The restart takes a couple of seconds and OBS '
            + 'sources reconnect by themselves - untick this to update by hand instead.';
    var c = document.createElement('input');
    c.type = 'checkbox';
    c.checked = updAuto;
    c.addEventListener('change', function(){
      var want = c.checked;
      c.disabled = true;
      fetch('/update/auto?on=' + (want ? '1' : '0'), {cache:'no-store'})
        .then(function(r){ return r.json(); })
        .then(function(j){ updAuto = !!(j && j.auto); })
        .catch(function(){ updAuto = !want; })        // it did not take; say so
        .then(function(){ c.checked = updAuto; c.disabled = false; });
    });
    w.appendChild(c);
    w.appendChild(document.createTextNode('Auto'));
    return w;
  }

  function updShowGo(j){
    updEl.innerHTML = '';
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'updgo';
    b.textContent = updAuto ? 'Update ready - install now' : 'Update available - install';
    b.title = (j && j.latestNote ? 'Latest change: ' + j.latestNote + '\n' : '')
            + 'Downloads the newest source and rebuilds it on this PC, then restarts.\n'
            + 'Takes under a minute; overlays in OBS blink once and come back on their own.'
            + (updAuto ? '\nIt will do this on its own within a few minutes - '
                       + 'this button is only for not waiting even that long.' : '');
    b.addEventListener('click', function(){ b.disabled = true; updRun(); });
    updEl.appendChild(b);
    updEl.appendChild(updAutoToggle());
  }

  // The resting state: a quiet manual check. The automatic check caches for
  // half an hour, which is right for every ordinary day and wrong in the ten
  // minutes after "I just pushed a fix, grab it" - this is the door for that.
  // Its answers show in place ("Up to date") and melt back to the link, so a
  // no-news check never leaves anything behind to dismiss.
  function updShowCheck(){
    updEl.innerHTML = '';
    var a = document.createElement('button');
    a.type = 'button'; a.className = 'updcheck';
    a.textContent = 'Check for updates';
    a.title = 'Asks GitHub right now whether anything newer has been published.';
    a.addEventListener('click', function(){
      a.disabled = true;
      a.textContent = 'Checking...';
      fetch('/update/check?force=1', {cache:'no-store'})
        .then(function(r){ return r.json(); })
        .then(function(j){
          if(j && j.build) updBuild = j.build;
          if(j && j.update){ updShowGo(j); return; }
          a.textContent = (j && j.ok) ? 'Up to date' : ((j && j.error) || 'Could not check');
          setTimeout(updShowCheck, 4000);
        })
        .catch(function(){
          a.textContent = 'Could not check';
          setTimeout(updShowCheck, 4000);
        });
    });
    updEl.appendChild(a);
    updEl.appendChild(updAutoToggle());
  }

  // On open: read the auto switch first - it changes what the other states
  // say - then one cached check (at most one GitHub call per half hour across
  // dashboard loads), then settle on whichever state is true.
  fetch('/update/status', {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(j){ if(j && typeof j.auto === 'boolean') updAuto = j.auto; })
    .catch(function(){})
    .then(function(){
      return fetch('/update/check', {cache:'no-store'})
        .then(function(r){ return r.json(); })
        .then(function(j){
          if(j && j.build) updBuild = j.build;
          if(j && j.update) updShowGo(j);
          else updShowCheck();
        });
    })
    .catch(function(){ updShowCheck(); });   // no answer now doesn't mean no door later
})();
</script>
</body>
</html>
