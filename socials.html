<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Socials</title>
<style>
  /* ---------------- Options via URL query params (all optional) ----------------
     ?mode=rotate|all              rotate = ONE plate; the handle is written
                                   once and never moves, only the platform icon
                                   cycles in place. all = every platform on
                                   screen at once, nothing cycling
                                                                (default rotate)
     ?handle=AlexsZed              one handle used for every platform
                                                                (default empty)
     ?tiktok=      ?youtube=       per-platform overrides; each falls back to
     ?instagram=                   ?handle= when it is not given
                                                                (default empty)
     ?show=tiktok,youtube,instagram
                                   which platforms appear, and in this order
                                   (default all three, that order)
     ?cycle=5                      seconds per icon in rotate mode, 2-30
                                                                (default 5)
     ?prefix=@                     drawn before the handle; set it empty for
                                   none                         (default @)
     ?brand=0                      1 paints each icon its brand colour (TikTok
                                   #25F4EE, YouTube #FF0000, Instagram #E1306C);
                                   0 keeps them on the accent, which is what
                                   matches the rest of the theme (default 0)
     ?accent=9bd4f5                accent colour, hex no #
     ?scale=1.0                    size multiplier 0.6-2        (default 1)
     ?radius=12                    corner radius px 0-40        (default 12)
     ?opacity=100                  plate opacity 10-100         (default 100)
     ?frame=blade|soft|none        blade = dark plate with the house cut corners
                                   and the two accent brackets; soft = plain
                                   rounded dark plate, no brackets; none = no
                                   plate at all, just icon and name over the
                                   scene                        (default blade)
     ?theme=name                   pin this source to one theme

     Two modes because two scenes. rotate is the compact one for gameplay: the
     name is written once, so the plate is only ever as wide as one handle no
     matter how many platforms are listed - the icon box beside it is a fixed
     size and the icons cross-fade inside it, so nothing reflows as they swap.
     all is for starting-soon or webcam scenes, where the space exists to show
     everything without taking turns.

     With no handle resolved for any shown platform the page draws nothing at
     all and stays invisible. An empty plate parked on stream is worse than no
     plate: it reads as the overlay being broken.
  ---------------------------------------------------------------------------- */
  :root{
    --accent:#9bd4f5;
    --overlay-opacity:1;
    --radius:12px;
    --card-bg:rgba(18,18,20,.86);
    --card-border:rgba(255,255,255,.09);
    --text:#fff;
  }
  /* Palettes other than this default come from /themes as data - shared.js
     writes them into a <style> tag. */
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}
  /* No align knobs: one plate, placed by dragging the OBS source itself. The
     padding is only clearance so a source cropped tight to the content does
     not shave the corner brackets' glow. */
  #stage{position:fixed;inset:0;display:flex;padding:24px;box-sizing:border-box;
    justify-content:flex-start;align-items:flex-start}

  /* The blade plate the session bar and the stat boxes wear. Deliberately NO
     backdrop blur - this sits over gameplay, and a blur resamples the frame
     behind it every frame to buy an effect the near-opaque plate hides. */
  .card{
    position:relative;display:flex;align-items:center;gap:12px;
    padding:10px 16px;
    background:var(--card-bg);border:1px solid var(--card-border);
    box-shadow:0 8px 26px rgba(0,0,0,.4);
    color:var(--text);white-space:nowrap;
    opacity:0;transform:translateY(8px);
    transition:opacity .45s ease,transform .45s cubic-bezier(.22,1.28,.35,1);
  }
  .card.show{opacity:var(--overlay-opacity);transform:none}
  /* One row per platform, for the mode=all case where the handles differ. */
  .card.col{flex-direction:column;align-items:flex-start;gap:8px}
  .row{display:flex;align-items:center;gap:12px}

  body.frame-blade .card{border-radius:var(--radius) 3px var(--radius) 3px}
  /* The accent brackets from the alert card, riding the two sharp corners. */
  body.frame-blade .card::before,
  body.frame-blade .card::after{
    content:"";position:absolute;width:18px;height:18px;pointer-events:none}
  body.frame-blade .card::before{top:-1px;right:-1px;
    border-top:2px solid var(--accent);border-right:2px solid var(--accent);
    border-top-right-radius:3px;filter:drop-shadow(0 0 6px var(--accent))}
  body.frame-blade .card::after{bottom:-1px;left:-1px;
    border-bottom:2px solid var(--accent);border-left:2px solid var(--accent);
    border-bottom-left-radius:3px;filter:drop-shadow(0 0 6px var(--accent))}

  body.frame-soft .card{border-radius:var(--radius)}
  /* Nothing but the icon and the name. The shadow goes too - a drop shadow
     under text with no plate behind it is just a smudge. */
  body.frame-none .card{background:none;border:0;box-shadow:none;padding:0}

  /* ---- icons ---------------------------------------------------------------
     Inline SVG, cloned from the hidden bank at the end of the body. Inline
     because an overlay must never wait on the network - a CDN icon that is
     slow, blocked or gone leaves a hole on stream where the logo should be.
     Everything is drawn in currentColor, so this one rule paints all three. */
  .icon{display:block;width:22px;height:22px;flex:0 0 auto;color:var(--accent)}
  /* Brand colours are opt-in: the accent is what agrees with the rest of the
     overlay, and three loud logos next to a themed plate fight it. */
  body.brand-on .icon.p-tiktok{color:#25F4EE}
  body.brand-on .icon.p-youtube{color:#FF0000}
  body.brand-on .icon.p-instagram{color:#E1306C}

  /* The whole point of rotate mode: a box the size of one icon, with all the
     icons stacked inside it out of flow. The plate's width is then fixed by
     the handle alone, and swapping icons cannot reflow or re-wrap anything. */
  .stack{position:relative;width:22px;height:22px;flex:0 0 auto}
  .stack .icon{position:absolute;left:0;top:0;opacity:0;transition:opacity .45s ease}
  .stack .icon.on{opacity:1}
  /* mode=all with one shared handle: the icons sit together, then the name
     once. Repeating the same name three times reads as a bug, not a list. */
  .icons{display:flex;align-items:center;gap:8px}

  .name{font-size:17px;font-weight:700;letter-spacing:-.01em;color:var(--text);
    white-space:nowrap}

  /* The bank the icons are cloned from; never drawn itself. */
  #bank{display:none}
</style>
<script src="/shared.js"></script>
<script>
/* Shared theme, read from the app rather than this browser - see shared.js for
   why an OBS source cannot use localStorage for this. ?theme= pins one source. */
if(window.NPO) NPO.themeBoot('source');
</script>
</head>
<body>
<div id="stage"><div id="wrap">
  <div class="card" id="card"></div>
</div></div>

<div id="bank">
  <svg class="icon" data-p="tiktok" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.53.02C13.84 0 15.14.01 16.44 0c.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>
  <!-- One path: the play triangle is a counter-wound subpath, so the default
       nonzero fill rule punches it out as a hole rather than painting over it. -->
  <svg class="icon" data-p="youtube" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.5 15.6V8.4l6.3 3.6-6.3 3.6z"/></svg>
  <!-- Three shapes rather than one: the camera body and the lens are strokes,
       so they stay hairlines at this size instead of filling in to a blob. -->
  <svg class="icon" data-p="instagram" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M7 2.2h10A4.8 4.8 0 0 1 21.8 7v10A4.8 4.8 0 0 1 17 21.8H7A4.8 4.8 0 0 1 2.2 17V7A4.8 4.8 0 0 1 7 2.2z" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="17.6" cy="6.4" r="1.3" fill="currentColor" stroke="none"/>
  </svg>
</div>

<script>
(function(){
  var qs = new URLSearchParams(location.search);
  var root = document.documentElement;
  var wrap = document.getElementById('wrap');
  var card = document.getElementById('card');
  var bank = document.getElementById('bank');

  function hex(name, cssVar){
    var v = (qs.get(name) || '').replace('#','');
    if(/^[0-9a-fA-F]{3,8}$/.test(v)) root.style.setProperty(cssVar, '#'+v);
  }
  hex('accent','--accent');

  var frame = (qs.get('frame')||'blade').toLowerCase();
  if(['blade','soft','none'].indexOf(frame) < 0) frame = 'blade';
  document.body.className = 'frame-' + frame;
  if(qs.get('brand') === '1') document.body.classList.add('brand-on');

  var r = parseInt(qs.get('radius'),10);
  if(isFinite(r) && r >= 0 && r <= 40) root.style.setProperty('--radius', r+'px');

  // zoom rather than transform, the trick alerts.html uses: zoom reflows, so a
  // scaled plate still occupies the space it looks like it occupies.
  var sc = parseFloat(qs.get('scale'));
  if(isFinite(sc) && sc >= 0.6 && sc <= 2 && sc !== 1) wrap.style.zoom = sc;

  var op = parseFloat(qs.get('opacity'));
  if(isFinite(op)){
    if(op > 0 && op <= 1) op *= 100;
    op = Math.max(10, Math.min(100, op));
    root.style.setProperty('--overlay-opacity', (op/100).toFixed(3));
  }

  // Absent and empty are different answers here: no ?prefix= means the default
  // @, ?prefix= with nothing after it means the streamer asked for none.
  var prefix = qs.get('prefix');
  if(prefix === null) prefix = '@';
  if(prefix.length > 4) prefix = prefix.slice(0, 4);

  // ---- what to show ---------------------------------------------------------
  var KNOWN = ['tiktok','youtube','instagram'];

  function clean(s){
    s = (s || '').trim();
    // A handle pasted with its @ already on it, next to the default prefix,
    // would come out as @@name. Strip the one the prefix is about to redraw.
    while(s.charAt(0) === '@') s = s.slice(1);
    if(s.length > 32) s = s.slice(0, 32);
    return s;
  }

  var shared = clean(qs.get('handle'));

  // ?show= sets both membership and order, so the streamer can lead with the
  // platform they care about. Unknown names and repeats are dropped rather
  // than guessed at.
  var order = [], i, want, part;
  var asked = (qs.get('show') || '').split(',');
  for(i = 0; i < asked.length; i++){
    part = asked[i].trim().toLowerCase();
    if(KNOWN.indexOf(part) >= 0 && order.indexOf(part) < 0) order.push(part);
  }
  if(!order.length) order = KNOWN.slice();

  // A platform with no handle to print is not shown at all - an icon with
  // nothing beside it tells a viewer nothing.
  var list = [];
  for(i = 0; i < order.length; i++){
    want = clean(qs.get(order[i])) || shared;
    if(want) list.push({ p: order[i], h: prefix + want, bare: want });
  }
  // Nothing resolved: leave the page completely blank. Bailing here means the
  // card is never filled and never gets .show, so it stays at opacity 0 - an
  // empty plate on stream is worse than no plate.
  if(!list.length) return;

  var mode = (qs.get('mode')||'rotate').toLowerCase();
  if(['rotate','all'].indexOf(mode) < 0) mode = 'rotate';

  // ---- building -------------------------------------------------------------
  // setAttribute('class') rather than .className: on an SVG element className
  // is an SVGAnimatedString, not a string, so assigning to it silently does
  // nothing and the icon would come out unstyled.
  function iconFor(platform, extra){
    var el = bank.querySelector('[data-p="' + platform + '"]').cloneNode(true);
    el.setAttribute('class', 'icon p-' + platform + (extra || ''));
    return el;
  }
  function nameFor(text){
    var el = document.createElement('span');
    el.className = 'name';
    el.textContent = text;   // the query string is not trusted markup
    return el;
  }

  if(mode === 'rotate'){
    // The handle is written once, outside the cycle, and never touched again.
    var stack = document.createElement('div');
    stack.className = 'stack';
    var icons = [];
    for(i = 0; i < list.length; i++){
      var ic = iconFor(list[i].p, i === 0 ? ' on' : '');
      stack.appendChild(ic);
      icons.push(ic);
    }
    card.appendChild(stack);
    card.appendChild(nameFor(list[0].h));

    // One platform is not a rotation. Show it and never start a timer that
    // would wake the page up every few seconds to change nothing.
    if(icons.length > 1){
      var secs = parseFloat(qs.get('cycle'));
      if(!isFinite(secs) || secs < 2 || secs > 30) secs = 5;
      var at = 0;
      setInterval(function(){
        // Both classes flip in the same frame, so the outgoing icon fades out
        // across exactly the window the incoming one fades in.
        icons[at].setAttribute('class', 'icon p-' + list[at].p);
        at = (at + 1) % icons.length;
        icons[at].setAttribute('class', 'icon p-' + list[at].p + ' on');
      }, secs * 1000);
    }
  } else {
    // Do the handles actually differ? One name on every platform is the common
    // case, and printing it three times looks like a mistake - so group the
    // icons and write the name once. Decided from the real values, not a param.
    var same = true;
    for(i = 1; i < list.length; i++){
      if(list[i].bare !== list[0].bare){ same = false; break; }
    }
    if(same){
      var group = document.createElement('div');
      group.className = 'icons';
      for(i = 0; i < list.length; i++) group.appendChild(iconFor(list[i].p));
      card.appendChild(group);
      card.appendChild(nameFor(list[0].h));
    } else {
      card.classList.add('col');
      for(i = 0; i < list.length; i++){
        var row = document.createElement('div');
        row.className = 'row';
        row.appendChild(iconFor(list[i].p));
        row.appendChild(nameFor(list[i].h));
        card.appendChild(row);
      }
    }
  }

  // ---- reveal ---------------------------------------------------------------
  // Same rAF-plus-timer net as every other page here: an OBS source that is not
  // compositing never fires rAF, and without the timer the plate would stage
  // its entrance forever and never arrive.
  function on(){ card.classList.add('show'); }
  requestAnimationFrame(on);
  setTimeout(on, 60);
})();
</script>
</body>
</html>
