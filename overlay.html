<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Now Playing</title>
<style>
  /* ---------------- Options via URL query params (all optional) ----------------
     ?layout=card|ticker|big|minimal   which overlay style        (default card)
     ?accent=1db954                    accent color, hex no #
     ?theme=glass|solid                card chrome (card + big)   (default glass)
     ?align=left|right                 side it sits / slides from (default left)
     ?valign=top|bottom                vertical position          (default bottom)
     ?scale=1.0                        size multiplier
     ?radius=18                        corner radius px
     ?speed=60                         ticker scroll px/sec       (default 60)
     ?showAlbum=0|1                    show album line
     ?showArt=0|1                      show album art             (default 1)
     ?hideWhenPaused=0|1               hide while paused vs dim
  ---------------------------------------------------------------------------- */
  :root{
    --accent:#1db954;
    --radius:18px;
    --card-bg:rgba(18,18,20,.82);
    --card-border:rgba(255,255,255,.08);
    --text:#fff;
    --subtext:rgba(255,255,255,.62);
  }
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}
  #stage{position:fixed;inset:0;display:flex;padding:24px;box-sizing:border-box;}
  #stage.h-left{justify-content:flex-start}
  #stage.h-right{justify-content:flex-end}
  #stage.v-top{align-items:flex-start}
  #stage.v-bottom{align-items:flex-end}

  /* hidden/shown state shared by every layout */
  .wrap{opacity:0;transform:translateY(140%);
    transition:transform .55s cubic-bezier(.2,.9,.25,1),opacity .45s ease;}
  #stage.v-top .wrap{transform:translateY(-140%)}
  .wrap.show{opacity:1;transform:translateY(0)}
  .wrap.paused{filter:saturate(.55) brightness(.82)}

  /* ---------- shared bits ---------- */
  /* Every layout reuses one markup tree, so parts are hidden by default and
     switched on only by the layout that actually wants them. Without this a
     layout inherits the others' empty boxes and picks up phantom gaps. */
  .backdrop,.accent-bar,.badge,.ticker-view{display:none}
  body.layout-big .backdrop{display:block}
  body.layout-minimal .accent-bar{display:block}
  body.layout-ticker .badge{display:flex}
  body.layout-ticker .ticker-view{display:block}
  body.layout-ticker .meta{display:none}   /* ticker renders its own text */

  .art{position:relative;flex:0 0 auto;overflow:hidden;background:#2a2a2e;
    border-radius:calc(var(--radius) - 6px);box-shadow:0 6px 18px rgba(0,0,0,.5);}
  .art img{width:100%;height:100%;object-fit:cover;display:block}
  .art .fallback{position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;color:var(--subtext)}
  .noart .art{display:none}

  .eyebrow{display:flex;align-items:center;gap:8px;color:var(--accent);
    font-weight:700;letter-spacing:.14em;text-transform:uppercase}
  .eq{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
  .eq span{width:3px;background:var(--accent);border-radius:2px;height:30%;
    animation:bounce 1s ease-in-out infinite}
  .eq span:nth-child(2){animation-delay:.2s}.eq span:nth-child(3){animation-delay:.4s}
  .eq span:nth-child(4){animation-delay:.15s}.eq span:nth-child(5){animation-delay:.35s}
  .wrap.paused .eq span{animation-play-state:paused;height:30%}
  @keyframes bounce{0%,100%{height:25%}50%{height:100%}}

  /* Live mode: heights come from the real spectrum as inline styles, so the
     canned keyframe animation has to get out of the way. The short transition
     smooths between 30fps frames without adding visible lag. */
  .eq.live span{animation:none !important;transition:height .07s linear}
  .wrap.paused .eq.live span{height:12% !important;transition:height .35s ease}
  .eq.off{display:none}

  .title,.artist,.album{white-space:nowrap;overflow:hidden}
  .artist,.album{text-overflow:ellipsis}
  .title{color:var(--text);font-weight:700;line-height:1.15}
  .artist{color:var(--subtext);font-weight:500}
  .album{color:var(--subtext);opacity:.8}

  /* marquee only when the title actually overflows; distance measured in JS */
  .title.marquee .scroller{display:inline-block;
    animation:mq var(--dur,10s) ease-in-out infinite alternate}
  @keyframes mq{from{transform:translateX(0)}to{transform:translateX(calc(-1 * var(--dist,0px)))}}

  /* ============================ LAYOUT: card ============================ */
  body.layout-card .wrap{display:flex;align-items:center;gap:16px;
    padding:14px 20px 14px 14px;background:var(--card-bg);
    border:1px solid var(--card-border);border-radius:var(--radius);
    backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);
    box-shadow:0 12px 40px rgba(0,0,0,.45);max-width:560px}
  body.layout-card .art{width:64px;height:64px}
  body.layout-card .art .fallback{font-size:26px}
  body.layout-card .art::after{content:"";position:absolute;inset:-2px;border-radius:inherit;
    box-shadow:0 0 22px -2px var(--accent);opacity:0;transition:opacity .4s}
  body.layout-card .wrap.show .art::after{opacity:.55}
  body.layout-card .meta{min-width:0;display:flex;flex-direction:column;gap:3px}
  body.layout-card .eyebrow{font-size:11px}
  body.layout-card .title{font-size:19px;max-width:360px}
  body.layout-card .artist{font-size:14px;max-width:360px}
  body.layout-card .album{font-size:12px;max-width:360px}

  /* ============================ LAYOUT: big ============================= */
  body.layout-big .wrap{position:relative;display:flex;align-items:center;gap:28px;
    padding:24px 40px 24px 24px;background:var(--card-bg);
    border:1px solid var(--card-border);border-radius:var(--radius);
    backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
    box-shadow:0 24px 70px rgba(0,0,0,.55);max-width:900px;overflow:hidden}
  /* blurred album art bleeding through the card background */
  body.layout-big .backdrop{position:absolute;inset:0;background-size:cover;
    background-position:center;filter:blur(38px) saturate(180%) brightness(.55);
    transform:scale(1.35);opacity:0;transition:opacity .6s;z-index:0}
  body.layout-big .wrap.show .backdrop{opacity:.75}
  body.layout-big .art,body.layout-big .meta{position:relative;z-index:1}
  body.layout-big .art{width:160px;height:160px;border-radius:calc(var(--radius) - 4px);
    box-shadow:0 14px 40px rgba(0,0,0,.6)}
  body.layout-big .art .fallback{font-size:60px}
  body.layout-big .meta{min-width:0;display:flex;flex-direction:column;gap:8px}
  body.layout-big .eyebrow{font-size:14px;letter-spacing:.18em}
  body.layout-big .eq{height:16px}
  body.layout-big .eq span{width:4px}
  body.layout-big .title{font-size:38px;max-width:620px;letter-spacing:-.01em}
  body.layout-big .artist{font-size:22px;max-width:620px;color:rgba(255,255,255,.8)}
  body.layout-big .album{font-size:16px;max-width:620px}

  /* =========================== LAYOUT: ticker ========================== */
  /* Full-width bar with seamless continuously scrolling text. */
  body.layout-ticker #stage{padding:0}
  body.layout-ticker .wrap{display:flex;align-items:center;gap:16px;width:100%;
    padding:0 0 0 14px;height:64px;background:var(--card-bg);
    border-top:1px solid var(--card-border);border-bottom:2px solid var(--accent);
    backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);
    box-sizing:border-box;overflow:hidden}
  body.layout-ticker .art{width:44px;height:44px;border-radius:6px}
  body.layout-ticker .art .fallback{font-size:20px}
  body.layout-ticker .badge{flex:0 0 auto;display:flex;align-items:center;gap:8px;
    padding-right:16px;margin-right:2px;border-right:1px solid var(--card-border);
    color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;height:64px}
  body.layout-ticker .ticker-view{flex:1 1 auto;overflow:hidden;position:relative;height:64px}
  body.layout-ticker .ticker-track{display:flex;align-items:center;height:64px;
    width:max-content;animation:ticker var(--tdur,20s) linear infinite}
  body.layout-ticker .wrap.paused .ticker-track{animation-play-state:paused}
  body.layout-ticker .ticker-item{white-space:nowrap;padding-right:80px;
    color:var(--text);font-size:20px;font-weight:600}
  body.layout-ticker .ticker-item .by{color:var(--subtext);font-weight:400}
  body.layout-ticker .ticker-item .dot{color:var(--accent);padding:0 14px}
  @keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}

  /* ========================== LAYOUT: minimal ========================== */
  /* No card, no chrome - just legible text over whatever is behind it. */
  body.layout-minimal .wrap{display:flex;align-items:center;gap:12px;padding:0}
  body.layout-minimal .art{width:48px;height:48px;border-radius:8px;
    box-shadow:0 4px 16px rgba(0,0,0,.7)}
  body.layout-minimal .art .fallback{font-size:20px}
  body.layout-minimal .meta{display:flex;flex-direction:column;gap:1px}
  body.layout-minimal .eyebrow{display:none}
  body.layout-minimal .title{font-size:20px;max-width:520px;
    text-shadow:0 2px 8px rgba(0,0,0,.9),0 0 2px rgba(0,0,0,.8)}
  body.layout-minimal .artist{font-size:15px;max-width:520px;color:rgba(255,255,255,.78);
    text-shadow:0 2px 8px rgba(0,0,0,.9),0 0 2px rgba(0,0,0,.8)}
  body.layout-minimal .album{display:none}
  body.layout-minimal .accent-bar{width:3px;align-self:stretch;min-height:40px;
    background:var(--accent);border-radius:2px;box-shadow:0 0 12px var(--accent)}

  /* theme=solid drops the translucency (card + big) */
  body.theme-solid .wrap{background:rgba(16,16,18,.985);
    backdrop-filter:none;-webkit-backdrop-filter:none}
  body.theme-solid .backdrop{display:none}
</style>
</head>
<body>
  <div id="stage">
    <div class="wrap" id="wrap">
      <div class="backdrop" id="backdrop"></div>
      <div class="accent-bar"></div>
      <div class="badge">
        <span class="eq"><span></span><span></span><span></span><span></span><span></span></span>
        <span>Now Playing</span>
      </div>
      <div class="art" id="artBox">
        <img id="art" alt="" style="display:none" />
        <div class="fallback" id="fallback">&#9835;</div>
      </div>
      <div class="meta">
        <div class="eyebrow">
          <span class="eq"><span></span><span></span><span></span><span></span><span></span></span>
          <span id="eyebrow-text">Now Playing</span>
        </div>
        <div class="title" id="title"><span class="scroller">&mdash;</span></div>
        <div class="artist" id="artist"></div>
        <div class="album" id="album" style="display:none"></div>
      </div>
      <div class="ticker-view" id="tickerView">
        <div class="ticker-track" id="tickerTrack"></div>
      </div>
    </div>
  </div>

<script>
(function(){
  var q = new URLSearchParams(location.search);
  var root = document.documentElement, body = document.body;

  // theme=minimal used to be how you got the stripped-down look; keep it working.
  var layout = (q.get('layout')||'').toLowerCase();
  var theme  = (q.get('theme')||'').toLowerCase();
  if(!layout){ layout = (theme==='minimal') ? 'minimal' : 'card'; }
  if(['card','ticker','big','minimal'].indexOf(layout)<0) layout='card';
  body.classList.add('layout-'+layout);
  body.classList.add('theme-' + (theme==='solid' ? 'solid' : 'glass'));

  if(q.get('accent')) root.style.setProperty('--accent','#'+q.get('accent').replace('#',''));
  if(q.get('radius')) root.style.setProperty('--radius',parseInt(q.get('radius'),10)+'px');
  var scale = parseFloat(q.get('scale')||'1');

  var stage = document.getElementById('stage');
  stage.classList.add('h-' + (q.get('align')==='right' ? 'right' : 'left'));
  stage.classList.add('v-' + (q.get('valign')==='top' ? 'top' : 'bottom'));

  var hideWhenPaused = q.get('hideWhenPaused')==='1';
  var showAlbum = q.get('showAlbum')==='1';
  var showArt = q.get('showArt')!=='0';
  var speed = Math.max(10, parseFloat(q.get('speed')||'60'));   // px/sec for ticker

  var wrap=document.getElementById('wrap'), img=document.getElementById('art'),
      fb=document.getElementById('fallback'), titleEl=document.getElementById('title'),
      scroller=titleEl.querySelector('.scroller'),
      artistEl=document.getElementById('artist'), albumEl=document.getElementById('album'),
      eyebrow=document.getElementById('eyebrow-text'), backdrop=document.getElementById('backdrop'),
      tickerTrack=document.getElementById('tickerTrack'), tickerView=document.getElementById('tickerView');

  if(scale && scale!==1) wrap.style.zoom = scale;
  if(!showArt) body.classList.add('noart');

  var lastId=null;

  function setArt(id, hasArt){
    if(showArt && hasArt){
      img.onload=function(){ img.style.display='block'; fb.style.display='none'; };
      img.onerror=function(){ img.style.display='none'; fb.style.display='flex'; };
      img.src='/art?id='+encodeURIComponent(id);
      backdrop.style.backgroundImage="url('/art?id="+encodeURIComponent(id)+"')";
    } else {
      img.style.display='none'; fb.style.display='flex'; img.removeAttribute('src');
      backdrop.style.backgroundImage='';
    }
  }

  // Only scroll the title if it genuinely doesn't fit.
  function fitMarquee(){
    titleEl.classList.remove('marquee');
    scroller.style.removeProperty('--dist');
    scroller.style.removeProperty('--dur');
    var over = scroller.scrollWidth - titleEl.clientWidth;
    if(over > 4){
      scroller.style.setProperty('--dist', over+'px');
      scroller.style.setProperty('--dur', Math.max(6, over/30 + 4)+'s');
      titleEl.classList.add('marquee');
    }
  }

  // Ticker: the track is one repeating "set" duplicated once, scrolled -50%,
  // which loops seamlessly. A short title would leave a visible gap, so the set
  // repeats enough times to overfill the bar first. Duration follows the set
  // width so px/sec stays constant no matter how long the title is.
  function buildTicker(np){
    var html = '<span class="ticker-item">'+esc(np.title)+
               (np.artist ? '<span class="by"> by </span>'+esc(np.artist) : '')+
               (showAlbum && np.album ? '<span class="dot">&bull;</span><span class="by">'+esc(np.album)+'</span>' : '')+
               '<span class="dot">&bull;</span></span>';
    tickerTrack.innerHTML = html;
    var one = Math.max(1, tickerTrack.scrollWidth);
    var viewW = tickerView.clientWidth || 1;
    var reps = Math.max(1, Math.ceil(viewW / one));
    var set = new Array(reps + 1).join(html);
    tickerTrack.innerHTML = set + set;
    var half = tickerTrack.scrollWidth / 2;
    tickerTrack.style.setProperty('--tdur', (half / speed) + 's');
  }

  function esc(s){ return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function apply(np){
    if(!np || !np.title){ wrap.classList.remove('show'); lastId=null; return; }

    if(np.id !== lastId){
      lastId = np.id;
      scroller.textContent = np.title;
      artistEl.textContent = np.artist || '';
      if(showAlbum && np.album){ albumEl.textContent=np.album; albumEl.style.display='block'; }
      else albumEl.style.display='none';
      setArt(np.id, np.hasArt);
      if(layout==='ticker') buildTicker(np);
      wrap.classList.remove('show'); void wrap.offsetWidth; wrap.classList.add('show');
      setTimeout(function(){ fitMarquee(); if(layout==='ticker') buildTicker(np); }, 80);
    }

    if(np.playing){
      wrap.classList.remove('paused'); eyebrow.textContent='Now Playing';
      wrap.classList.add('show');
    } else {
      wrap.classList.add('paused'); eyebrow.textContent='Paused';
      if(hideWhenPaused) wrap.classList.remove('show'); else wrap.classList.add('show');
    }
  }

  // ---- live equaliser -------------------------------------------------
  // The server captures whatever Windows is playing, runs an FFT and streams
  // frequency bands over SSE. Bars are rebuilt to whatever ?bars= asks for and
  // each one takes the loudest band in its slice of the spectrum, so the left
  // bars follow bass and the right ones follow treble.
  var eqMode = (q.get('eq')||'live').toLowerCase();
  if(['live','anim','off'].indexOf(eqMode)<0) eqMode='live';
  var barCount = parseInt(q.get('bars')||'5',10);
  if(!(barCount>=3)) barCount=5; if(barCount>32) barCount=32;

  var eqs = [].slice.call(document.querySelectorAll('.eq'));

  function buildBars(){
    eqs.forEach(function(eq){
      if(eqMode==='off'){ eq.classList.add('off'); return; }
      if(eq.children.length===barCount) return;
      eq.innerHTML='';
      for(var i=0;i<barCount;i++) eq.appendChild(document.createElement('span'));
    });
  }
  buildBars();

  var liveOn=false;
  function setLive(on){
    if(on===liveOn) return;
    liveOn=on;
    eqs.forEach(function(eq){ eq.classList.toggle('live', on); });
    if(!on) eqs.forEach(function(eq){
      [].slice.call(eq.children).forEach(function(s){ s.style.height=''; });
    });
  }

  function applyBands(bands){
    var n = bands.length;
    for(var e=0;e<eqs.length;e++){
      var kids = eqs[e].children;
      for(var i=0;i<kids.length;i++){
        // Take the peak of this bar's slice; averaging washes out transients.
        var lo=Math.floor(i*n/kids.length), hi=Math.floor((i+1)*n/kids.length);
        if(hi<=lo) hi=lo+1;
        var v=0;
        for(var b=lo;b<hi && b<n;b++) if(bands[b]>v) v=bands[b];
        if(v<10) v=10;                       // keep a visible floor
        kids[i].style.height = v + '%';
      }
    }
  }

  if(eqMode==='live' && window.EventSource){
    var quietFrames=0;
    var es = new EventSource('/spectrum');
    es.onmessage = function(ev){
      var d;
      try { d = JSON.parse(ev.data); } catch(e){ return; }
      if(!d || !d.bands){ return; }
      // If audio capture is unavailable, fall back to the canned animation
      // rather than showing a row of dead bars.
      if(!d.active){ if(++quietFrames>90) setLive(false); return; }
      quietFrames=0;
      setLive(true);
      applyBands(d.bands);
    };
    es.onerror = function(){ setLive(false); };   // EventSource retries on its own
  }

  function tick(){
    fetch('/np',{cache:'no-store'})
      .then(function(r){return r.json();})
      .then(apply)
      .catch(function(){ wrap.classList.remove('show'); })
      .finally(function(){ setTimeout(tick,1500); });
  }
  tick();
  window.addEventListener('resize', function(){ fitMarquee(); });
})();
</script>
</body>
</html>
